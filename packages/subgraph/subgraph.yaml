specVersion: 1.0.0
indexerHints:
  prune: auto
schema:
  file: ./schema.graphql
dataSources:
  - kind: ethereum
    name: TrustPool
    network: celo
    source:
      address: "0xe7891De4005Ac5A2B6Cf3982C27c75A5B0F9b0FC"
      abi: TrustPool
      startBlock: 56212000
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.7
      language: wasm/assemblyscript
      entities:
        - TrustUpdated
        - Member
        - TrustLink
      abis:
        - name: TrustPool
          file: ./abis/TrustPool.json
      eventHandlers:
        - event: TrustUpdated(address,address,int96,int96,int96,uint256,uint256)
          handler: handleTrustUpdated
      file: ./src/trust-pool.ts
